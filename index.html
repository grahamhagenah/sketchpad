<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Bounce: sketch song demos in your browser</title>
    <meta
      name="description"
      content="Bounce is a free song demo sketchpad in your browser. Pick a key and tempo, build chord progressions, add drums, record vocals, then export MIDI, WAV or stems to Logic Pro or any DAW."
    />
    <meta name="theme-color" content="#121416" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://grahamhagenah.github.io/sketchpad/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- How the link looks when shared -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bounce" />
    <meta property="og:title" content="Bounce: sketch song demos in your browser" />
    <meta property="og:description" content="Chords, drums and vocals in one quick sketch, then export MIDI, WAV or stems to Logic Pro or any DAW." />
    <meta property="og:url" content="https://grahamhagenah.github.io/sketchpad/" />
    <meta property="og:image" content="https://grahamhagenah.github.io/sketchpad/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bounce, with a row of chords: Am, F, C, G" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Bounce",
        "url": "https://grahamhagenah.github.io/sketchpad/",
        "description": "A song demo sketchpad in the browser: chord progressions, drum grooves and vocal recording, exported as MIDI, WAV or stems.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with Web Audio",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- For search engines and anyone without JavaScript, since the app itself is drawn by it. -->
    <noscript>
      <h1>Bounce</h1>
      <p>Sketch song demos in your browser: build chord progressions, add drum grooves and record vocals, then export MIDI, WAV or stems to Logic Pro or any DAW. Bounce needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
